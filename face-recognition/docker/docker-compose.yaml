services:
  face-recognition:
    container_name: face-recognition
    build:
      context: .
      dockerfile: Dockerfile
    image: face-recognition:latest
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix:ro"
      - "/dev:/dev"
      - "../../:/root/workspace"
    environment:
      - DISPLAY=${DISPLAY}
    privileged: true
    runtime: nvidia
    network_mode: host
    ipc: "host"
    pid: "host"
    stdin_open: true
    tty: true
    command: bash
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
