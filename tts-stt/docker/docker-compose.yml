services:
  tts-stt:
    build:
      context: .
      dockerfile: Dockerfile
      network: host  # Use host network during build to avoid DNS issues
    image: tts-stt:latest
    runtime: nvidia
    privileged: true
    stdin_open: true  # equivalent to -it
    tty: true
    network_mode: host
    ipc: host
    pid: host
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY}
      - TERM=xterm-256color
    volumes:
      - /tmp:/tmp
      - /dev:/dev
      - ${PWD}/../../:/root/workspace/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
