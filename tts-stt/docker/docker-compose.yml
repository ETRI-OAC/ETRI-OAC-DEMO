services:
  tts-stt:
    build:
      context: .
      dockerfile: Dockerfile
      network: host  # Use host network during build to avoid DNS issues
    image: tts-stt:latest
    runtime: nvidia
    privileged: true
    stdin_open: true  # equivalent to -it
    tty: true
    network_mode: host
    ipc: host
    pid: host
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY}
      - TERM=xterm-256color
    volumes:
      - /tmp:/tmp
      - /dev:/dev
      - /var/nvidia/nvcam/settings/:/var/nvidia/nvcam/settings/
      - /etc/systemd/system/zed_x_daemon.service:/etc/systemd/system/zed_x_daemon.service
      - /usr/local/zed/resources/:/usr/local/zed/resources/
      - /usr/local/zed/settings/:/usr/local/zed/settings/
      - ${PWD}/../../:/root/workspace/

