services:
  tts-stt:
    container_name: base-tts-stt-1
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: tts-stt:latest
    privileged: true
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    pid: host
    environment:
      - DISPLAY=${DISPLAY}
      - TERM=xterm-256color
    volumes:
      - /tmp:/tmp
      - /dev:/dev
      - ${PWD}/../../:/root/workspace/
