services:
  zed_env:
    image: zed-env:l4t-r36.4
    build:
      context: .
      dockerfile: Dockerfile
    runtime: nvidia
    privileged: true
    stdin_open: true  # equivalent to -it
    tty: true
    network_mode: host
    shm_size: '16gb'  # Size of /dev/shm inside container
    environment:
      - DISPLAY=${DISPLAY}
      - TERM=xterm-256color
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /dev/:/dev/
      - /tmp/:/tmp/
      - /var/nvidia/nvcam/settings/:/var/nvidia/nvcam/settings/
      - /etc/systemd/system/zed_x_daemon.service:/etc/systemd/system/zed_x_daemon.service
      - ${HOME}/zed_docker_ai/:/usr/local/zed/resources/
      - ../..:/home
      - zed_shm:/dev/shm  # Shared memory volume (shared with host and other containers)
    working_dir: /home

volumes:
  zed_shm:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=2g
