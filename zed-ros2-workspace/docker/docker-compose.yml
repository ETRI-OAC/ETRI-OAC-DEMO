services:
  zed_ros2_env:
    image: oak_ros2_ubuntu24:latest
    privileged: true
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    pid: host
    environment:
      - DISPLAY=${DISPLAY}
      - TERM=xterm-256color
    volumes:
      - /tmp:/tmp
      - /dev:/dev
      - ${PWD}/../../:/root/workspace/
