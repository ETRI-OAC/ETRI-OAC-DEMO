services:
  zed_ros2_env:
    container_name: base-zed_ros2_env-1
    image: oak_ros2_ubuntu24:latest
    privileged: true
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    pid: host
    environment:
      - DISPLAY=${DISPLAY}
      - TERM=xterm-256color
    entrypoint: ["/root/workspace/zed-ros2-workspace/docker/entrypoint.sh"]
    command: ["sleep", "infinity"]
    volumes:
      - /tmp:/tmp
      - /dev:/dev
      - ${PWD}/../../:/root/workspace/
