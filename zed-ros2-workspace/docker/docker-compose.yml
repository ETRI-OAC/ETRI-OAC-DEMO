services:
  zed_ros2_env:
    image: zed_ros2_ubuntu24_sdk_4.2.3:latest
    runtime: nvidia
    privileged: true
    stdin_open: true  # equivalent to -it
    tty: true
    network_mode: host
    ipc: host
    pid: host
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY}
      - TERM=xterm-256color
    volumes:
      - /tmp:/tmp
      - /dev:/dev
      - /usr/local/zed/resources/:/usr/local/zed/resources/
      - /usr/local/zed/settings/:/usr/local/zed/settings/
      - ${PWD}/../../:/root/workspace/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
